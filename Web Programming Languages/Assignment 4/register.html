<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" type="text/css" href="css/mystyle.css"/>
        <script src="jquery/jquery-3.7.1.min.js"></script>
        <script src="js/main.js"></script>
        <script src="js/register.js"></script>
    </head>
    <body>
        <header></header>
        <main class="row">
            <div class="col-side">
                <h1>Register</h1>
            </div>
            <form id="register-form" class="col-50">
                <div class="row">
                    <div class="col">
                        <label for="firstname">First Name:</label>
                        <input type="text" id="firstname" name="firstname" required>
                    </div>
                    <div class="col">
                        <label for="lastname">Last Name:</label>
                        <input type="text" id="lastname" name="lastname" required>
                    </div>
                    <div class="col">
                        <label for="phonenumber">Phone Number:</label>
                        <input type="text" id="phonenumber" name="phonenumber" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="col">
                        <label for="dob">Date of Birth:</label>
                        <input type="date" id="dob" name="dob" required></input>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="col">
                        <label for="confirmpassword">Confirm Password:</label>
                        <input type="password" id="confirmpassword" name="confirmpassword" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label>Gender:</label>
                        <input type="radio" id="male" name="gender" value="male"><label>Male</label>
                        <input type="radio" id="female" name="gender" value="female"><label>Female</label>
                    </div>
                    <div class="col">
                        <button type="submit">Submit</button>
                        <p id="error"></p>
                    </div>
                </div>
            </form>
        </main>
        <footer></footer>
    </body>
</html>
