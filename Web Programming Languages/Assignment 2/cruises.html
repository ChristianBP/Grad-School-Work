<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" type="text/css" href="css/mystyle.css"/>
        <script src="js/jquery-3.7.1.min.js"></script>
        <script src="js/main.js"></script>
        <script src="js/cruises.js" type="module"></script>
    </head>
    <body>
        <header></header>
        <main class="row">
            <div class="col-side">
                <h1>Cruises</h1>
                <table id="cruise-info"></table>
            </div>
            <form id="cruise-form" class="col">
                <div class="row">
                    <div class="col">
                        <label for="destination"><img id="destination-icon" src="images/mountain-city.svg"> Destination:</label>
                        <select id="destination" name="destination">
                            <option value="alaska" selected>Alaska</option>
                            <option value="bahamas">Bahamas</option>
                            <option value="europe">Europe</option>
                            <option value="mexico">Mexico</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label for="departing-after">Departing Between</label>
                        <input type="date" id="departing-after" name="departing-after">
                    </div>
                    <div class="col">
                        <label for="departing-before">And</label>
                        <input type="date" id="departing-before" name="departing-before">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label for="minimum-duration">Minimum Duration (days):</label>
                        <input type="number" id="minimum-duration" name="minimum-duration" min="0" value="3">
                    </div>
                    <div class="col">
                        <label for="maximum-duration">Maximum Duration (days):</label>
                        <input type="number" id="maximum-duration" name="maximum-duration" min="0" value="10">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label for="num-rooms">Number of Rooms:</label>
                        <input type="number" id="num-rooms" name="num-rooms" min="0" value="1">
                    </div>
                    <div class="col">
                        <label for="num-passengers">Number of Passengers:</label>
                        <input type="number" id="num-passengers" name="num-passengers" min="0" value="1">
                    </div>
                </div>

                <p id="error"></p>

                <div class="row">
                    <div class="col ml-50">
                        <button type="submit">Submit</button>
                    </div>
                </div>
            </form>
        </main>
        <footer></footer>
    </body>
</html>
