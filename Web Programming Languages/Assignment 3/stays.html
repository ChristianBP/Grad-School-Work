<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" type="text/css" href="css/mystyle.css"/>
        <script src="js/jquery-3.7.1.min.js"></script>
        <script src="js/main.js"></script>
        <script src="js/stays.js" type="module"></script>
    </head>
    <body>
        <header></header>
        <main class="row">
            <div class="col-side">
                <h1>Stays</h1>
                <table id="stay-info"></table>
            </div>
            <form id="stay-form" class="col">
                <div class="row">
                    <div class="col">
                        <label for="city">City:</label>
                        <input type="text" id="city" name="city">
                    </div>
                    <div class="col">
                        <label for="num-rooms">Number of Rooms:</label>
                        <input type="number" id="num-rooms" name="num-rooms" min="1" value="1">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label for="check-in-date">Check-in Date:</label>
                        <input type="date" id="check-in-date" name="check-in-date">
                    </div>
                    <div class="col">
                        <label for="check-out-date">Check-out Date:</label>
                        <input type="date" id="check-out-date" name="check-out-date">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label for="adults">Adults:</label>
                        <input type="number" id="adults" name="adults" min="0" value="1">
                    </div>
                    <div class="col">
                        <label for="children">Children:</label>
                        <input type="number" id="children" name="children" min="0" value="0">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label for="infants">Infants:</label>
                        <input type="number" id="infants" name="infants" min="0" value="0">
                    </div>
                </div>

                <p id="error"></p>

                <div class="row">
                    <div class="col">
                        <button type="submit">Submit</button>
                    </div>
                </div>
            </form>
        </main>
        <footer></footer>
    </body>
</html>
