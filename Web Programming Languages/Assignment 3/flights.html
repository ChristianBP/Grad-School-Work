<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" type="text/css" href="css/mystyle.css"/>
        <script src="js/jquery-3.7.1.min.js"></script>
        <script src="js/main.js"></script>
        <script src="js/flights.js" type="module"></script>
    </head>
    <body>
        <header></header>
        <main class="row">
            <div class="col-side">
                <h1>Flights</h1>
                <table id="flight-info"></table>
            </div>
            <form id="flight-form" class="col">
                <div class="row">
                    <div class="col">
                        <label for="trip-type">Trip Type:</label>
                        <select id="trip-type" name="trip-type">
                            <option value="oneway">One Way</option>
                            <option value="roundtrip">Round Trip</option>
                        </select>
                    </div>
                </div>

                <div id="leaving">
                    <div class="row">
                        <div class="col">
                            <label for="origin"><img id="origin-icon" src="images/house.svg"> Origin:</label>
                            <input type="text" id="origin" name="origin">
                        </div>
                        <div class="col">
                            <label for="destination"><img id="destination-icon" src="images/mountain-city.svg"> Destination:</label>
                            <input type="text" id="destination" name="destination">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="departure-date-leave"><img id="departure-icon" src="images/plane-departure.svg"> Departure Date:</label>
                            <input type="date" id="departure-date-leave" name="departure-date-leave">
                        </div>
                        <div class="col">
                            <label for="arrival-date-leave"><img id="arrival-icon" src="images/plane-arrival.svg"> Arrival Date:</label>
                            <input type="date" id="arrival-date-leave" name="arrival-date-leave">
                        </div>
                    </div>
                </div>

                <div id="returning">
                    <div class="row">
                        <div class="col">
                            <label for="departure-date-return"><img id="return-departure-icon" src="images/plane-departure.svg"> Return Departure Date:</label>
                            <input type="date" id="departure-date-return" name="departure-date-return">
                        </div>
                        <div class="col">
                            <label for="arrival-date-return"><img id="return-arrival-icon" src="images/plane-departure.svg"> Return Arrival Date:</label>
                            <input type="date" id="arrival-date-return" name="arrival-date-return">
                        </div>
                    </div>
                </div>

                <p id="error"></p>

                <div class="row">
                    <div class="col ml-50">
                        <button type="submit">Submit</button>
                    </div>
                </div>
            </form>
            <div class="col-side">
                <h3>Passengers</h3>
                <img id="passengers-icon" src="images/person-walking-luggage.svg" alt="Passengers">
                <form id="passengers">
                    <div class="row">
                        <div class="col">
                            <label for="adults-toggle"><img id="adults-icon" src="images/person.svg"> Adults</label>
                            <input type="checkbox" id="adults-toggle" name="adults-toggle">
                        </div>
                        <div class="col adults">
                            <label for="adults">Number</label>
                            <input type="number" id="adults" name="adults" min="1" max="4" value="0">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="children-toggle"><img id="children-icon" src="images/child.svg"> Children</label>
                            <input type="checkbox" id="children-toggle" name="children-toggle">
                        </div>
                        <div class="col children">
                            <label for="children">Number</label>
                            <input type="number" id="children" name="children" min="0" max="4" value="0">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="infants-toggle"><img id="infants-icon" src="images/baby.svg"> Infants</label>
                            <input type="checkbox" id="infants-toggle" name="infants-toggle">
                        </div>
                        <div class="col infants">
                            <label for="infants">Number</label>
                            <input type="number" id="infants" name="infants" min="0" max="4" value="0">
                        </div>
                    </div>
                </form>
            </div>
        </main>
        <footer></footer>
    </body>
</html>
