<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" type="text/css" href="css/mystyle.css"/>
        <script src="jquery/jquery-3.7.1.min.js"></script>
        <script src="js/main.js"></script>
        <script src="js/cruises.js" type="module"></script>
    </head>
    <body>
        <header></header>
        <main class="row">
            <div class="col-side">
                <h1>Cruises</h1>
                <table id="cruise-info"></table>
            </div>
            <form id="cruise-form" class="col">
                <div class="row">
                    <div class="col">
                        <label for="destination"><img id="destination-icon" src="images/mountain-city.svg"> Destination:</label>
                        <select id="destination" name="destination">
                            <option value="alaska" selected>Alaska</option>
                            <option value="bahamas">Bahamas</option>
                            <option value="europe">Europe</option>
                            <option value="mexico">Mexico</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label for="departing-after">Departing Between</label>
                        <input type="date" id="departing-after" name="departing-after">
                    </div>
                    <div class="col">
                        <label for="departing-before">And</label>
                        <input type="date" id="departing-before" name="departing-before">
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label for="minimum-duration">Minimum Duration (days):</label>
                        <input type="number" id="minimum-duration" name="minimum-duration" min="0" value="3">
                    </div>
                    <div class="col">
                        <label for="maximum-duration">Maximum Duration (days):</label>
                        <input type="number" id="maximum-duration" name="maximum-duration" min="0" value="10">
                    </div>
                </div>

                <div class="row">
                    <div class="col-50">
                        <label for="num-rooms">Number of Rooms:</label>
                        <input type="number" id="num-rooms" name="num-rooms" min="0" value="1">
                    </div>
                    <div class="col">
                        <button type="submit">Submit</button>
                    </div>
                </div>

                <p id="error"></p>

                <div class="row">
                </div>
            </form>
            <div class="col-side">
                <h3>Guests</h3>
                <img id="passengers-icon" src="images/person-walking-luggage.svg" alt="Passengers">
                <form id="passengers">
                    <div class="row">
                        <div class="col-50">
                            <label for="adults-toggle"><img id="adults-icon" src="images/person.svg"> Adults</label>
                            <input type="checkbox" id="adults-toggle" name="adults-toggle">
                        </div>
                        <div class="col adults">
                            <label for="adults">Number</label>
                            <input type="number" id="adults" name="adults" min="0" value="0">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-50">
                            <label for="children-toggle"><img id="children-icon" src="images/child.svg"> Children</label>
                            <input type="checkbox" id="children-toggle" name="children-toggle">
                        </div>
                        <div class="col children">
                            <label for="children">Number</label>
                            <input type="number" id="children" name="children" min="0" value="0">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-50">
                            <label for="infants-toggle"><img id="infants-icon" src="images/baby.svg"> Infants</label>
                            <input type="checkbox" id="infants-toggle" name="infants-toggle">
                        </div>
                        <div class="col infants">
                            <label for="infants">Number</label>
                            <input type="number" id="infants" name="infants" min="0" value="0">
                        </div>
                    </div>
                </form>
            </div>
        </main>
        <footer></footer>
    </body>
</html>
